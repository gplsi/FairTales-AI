<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FairTales AI Data Browser</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5f0;
        --surface: #ffffff;
        --text: #202124;
        --muted: #62656a;
        --line: #d8d2c8;
        --accent: #0f766e;
        --accent-soft: #d8f3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.75rem, 4vw, 3rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.18em;
      }

      .home-link {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        text-decoration: none;
        font-weight: 650;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin: 24px 0;
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 14px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      nav a {
        color: var(--text);
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        overflow: hidden;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
      }

      .row:first-child {
        border-top: 0;
      }

      .name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 650;
      }

      .meta {
        color: var(--muted);
        white-space: nowrap;
        font-size: 0.92rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 0 9px;
        background: var(--accent-soft);
        color: #0b4f4a;
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .empty,
      .error {
        padding: 18px;
        color: var(--muted);
      }

      .error {
        color: #9f1239;
      }

      @media (max-width: 680px) {
        header,
        .toolbar {
          grid-template-columns: 1fr;
          display: grid;
        }

        .home-link {
          width: max-content;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>FairTales AI Data Browser</h1>
          <p>Browse the generated metrics, aggregations, logs, and score files published with the site.</p>
        </div>
        <a class="home-link" href="index.html">Back to overview</a>
      </header>

      <div class="toolbar">
        <input id="search" type="search" autocomplete="off" placeholder="Filter current folder" />
        <button id="clear" type="button">Clear</button>
      </div>

      <nav id="breadcrumbs" aria-label="Breadcrumb"></nav>
      <section class="panel" id="listing" aria-live="polite"></section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const requestedPath = params.get("path") || "runs-FairTales AI";
      const listing = document.querySelector("#listing");
      const breadcrumbs = document.querySelector("#breadcrumbs");
      const search = document.querySelector("#search");
      const clear = document.querySelector("#clear");

      let manifest;
      let currentNode;
      let currentPath;

      function encodePath(path) {
        return path.split("/").map(encodeURIComponent).join("/");
      }

      function browserUrl(path) {
        return `data-browser.html?path=${encodeURIComponent(path)}`;
      }

      function fileSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        const units = ["KB", "MB", "GB"];
        let size = bytes / 1024;
        let unit = units.shift();
        while (size >= 1024 && units.length) {
          size /= 1024;
          unit = units.shift();
        }
        return `${size.toFixed(size >= 10 ? 0 : 1)} ${unit}`;
      }

      function findNode(path) {
        const normalized = path.replace(/\/+$/, "");
        if (normalized === manifest.generated_from) return manifest.tree;

        const parts = normalized.split("/").slice(1);
        let node = manifest.tree;
        for (const part of parts) {
          const next = node.directories.find((directory) => directory.name === part);
          if (!next) return null;
          node = next.children;
        }
        return node;
      }

      function renderBreadcrumbs(path) {
        const parts = path.split("/");
        breadcrumbs.textContent = "";
        let accumulated = "";
        parts.forEach((part, index) => {
          accumulated = index === 0 ? part : `${accumulated}/${part}`;
          if (index > 0) breadcrumbs.append(" / ");
          const link = document.createElement("a");
          link.href = browserUrl(accumulated);
          link.textContent = part;
          breadcrumbs.append(link);
        });
      }

      function row(label, meta, href, badge) {
        const item = document.createElement("div");
        item.className = "row";

        const name = document.createElement("a");
        name.className = "name";
        name.href = href;
        name.textContent = label;

        const details = document.createElement("div");
        details.className = "meta";
        if (badge) {
          const badgeNode = document.createElement("span");
          badgeNode.className = "badge";
          badgeNode.textContent = badge;
          details.append(badgeNode);
          details.append(" ");
        }
        details.append(meta);

        item.append(name, details);
        return item;
      }

      function renderListing() {
        const term = search.value.trim().toLowerCase();
        const directories = currentNode.directories.filter((item) => item.name.toLowerCase().includes(term));
        const files = currentNode.files.filter((item) => item.name.toLowerCase().includes(term));

        listing.textContent = "";
        if (!directories.length && !files.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No matching files or folders in this directory.";
          listing.append(empty);
          return;
        }

        directories.forEach((directory) => {
          const count = directory.children.directories.length + directory.children.files.length;
          listing.append(row(directory.name, `${count} items`, browserUrl(directory.path), "Folder"));
        });

        files.forEach((file) => {
          listing.append(row(file.name, fileSize(file.size), encodePath(file.path), "File"));
        });
      }

      fetch("data-manifest.json")
        .then((response) => {
          if (!response.ok) throw new Error(`Could not load data-manifest.json (${response.status})`);
          return response.json();
        })
        .then((data) => {
          manifest = data;
          currentPath = requestedPath.replace(/\/+$/, "");
          currentNode = findNode(currentPath);
          if (!currentNode) throw new Error(`Path not found in manifest: ${currentPath}`);
          document.title = `${currentPath} - FairTales AI Data Browser`;
          renderBreadcrumbs(currentPath);
          renderListing();
        })
        .catch((error) => {
          listing.innerHTML = `<div class="error">${error.message}</div>`;
        });

      search.addEventListener("input", renderListing);
      clear.addEventListener("click", () => {
        search.value = "";
        renderListing();
        search.focus();
      });
    </script>
  </body>
</html>
